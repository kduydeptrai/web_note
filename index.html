    <!-- Prompt tạo/đổi tên thư mục -->
    <div class="prompt-modal" id="promptModal">
        <div class="prompt-box" onclick="event.stopPropagation()">
            <div class="prompt-title" id="promptTitle">
                <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                <span id="promptTitleText">Tạo thư mục mới</span>
            </div>
            <input type="text" class="prompt-input" id="promptInput" placeholder="Nhập tên thư mục..." maxlength="50">
            <div class="prompt-actions">
                <button class="btn btn-ghost" onclick="closePrompt()">Hủy</button>
                <button class="btn btn-primary" id="promptConfirmBtn">Tạo</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'hmb_agency_notes';
        const FOLDER_KEY = 'hmb_agency_folders';
        const NOTES_PER_PAGE_DESKTOP = 40;
        const NOTES_PER_PAGE_MOBILE = 10;

        let currentFilter = 'all';
        let currentSearch = '';
        let currentFolder = 'all'; // 'all' | 'none' | folderId
        let currentPage = 1;
        let currentNoteId = null;
        let promptMode = 'create'; // 'create' | 'rename'
        let promptRenameId = null;

        const ICONS = {
            file: `<svg class="ic ic-xl" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>`,
            search: `<svg class="ic ic-xl" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>`,
            folder: `<svg class="ic ic-xl" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`,
            plus: `<svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>`,
            chevronL: `<svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>`,
            chevronR: `<svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>`,
            edit: `<svg class="ic ic-xs" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`,
            trash: `<svg class="ic ic-xs" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`
        };

        function getNotesPerPage() {
            return window.matchMedia('(max-width: 768px)').matches
                ? NOTES_PER_PAGE_MOBILE
                : NOTES_PER_PAGE_DESKTOP;
        }

        // ===== Notes data =====
        function getNotes() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function saveNotes(notes) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
            } catch (e) {
                alert('Không thể lưu ghi chú. Bộ nhớ có thể đã đầy!');
            }
        }

        // ===== Folders data =====
        function getFolders() {
            try {
                const data = localStorage.getItem(FOLDER_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function saveFolders(folders) {
            try {
                localStorage.setItem(FOLDER_KEY, JSON.stringify(folders));
            } catch (e) {
                alert('Không thể lưu thư mục!');
            }
        }

        function getFolderById(id) {
            return getFolders().find(f => f.id === id);
        }

        function getFolderNoteCount(folderId) {
            return getNotes().filter(n => n.folderId === folderId).length;
        }

        function getUnfiledCount() {
            return getNotes().filter(n => !n.folderId).length;
        }

        // ===== Search helper =====
        function removeDiacritics(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
        }

        function noteMatchesSearch(note, keyword) {
            if (!keyword) return true;
            const content = (note.content || '').toLowerCase();
            const contentNoDiacritic = removeDiacritics(note.content || '');
            const keywordLower = keyword.toLowerCase();
            const keywordNoDiacritic = removeDiacritics(keyword);
            return content.includes(keywordLower) || contentNoDiacritic.includes(keywordNoDiacritic);
        }

        // ===== Filter =====
        function filterNotesByTime(notes) {
            if (currentFilter === 'all') return notes;
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            return notes.filter(note => {
                const d = new Date(note.createdAt);
                switch (currentFilter) {
                    case 'today': return d >= startOfToday;
                    case 'week': {
                        const w = new Date(now); w.setDate(now.getDate() - 7);
                        return d >= w;
                    }
                    case 'month': {
                        const m = new Date(now); m.setDate(now.getDate() - 30);
                        return d >= m;
                    }
                    case 'year': return d.getFullYear() === now.getFullYear();
                    default: return true;
                }
            });
        }

        function filterNotesByFolder(notes) {
            if (currentFolder === 'all') return notes;
            if (currentFolder === 'none') return notes.filter(n => !n.folderId);
            return notes.filter(n => n.folderId === currentFolder);
        }

        function getFilterLabel(filter) {
            const labels = {
                all: 'Tất cả ghi chú',
                today: 'Hôm nay',
                week: '7 ngày qua',
                month: '30 ngày qua',
                year: 'Trong năm nay'
            };
            return labels[filter] || labels.all;
        }

        // ===== Toggle panels =====
        function closeAllPanels() {
            document.getElementById('folderPanel').classList.remove('open');
            document.getElementById('searchPanel').classList.remove('open');
            document.getElementById('filterDropdown').classList.remove('open');
        }

        function toggleFolderPanel(e) {
            e.stopPropagation();
            const p = document.getElementById('folderPanel');
            const willOpen = !p.classList.contains('open');
            closeAllPanels();
            if (willOpen) {
                renderFolderList();
                p.classList.add('open');
            }
        }

        function toggleSearchPanel(e) {
            e.stopPropagation();
            const p = document.getElementById('searchPanel');
            const willOpen = !p.classList.contains('open');
            closeAllPanels();
            if (willOpen) {
                p.classList.add('open');
                setTimeout(() => {
                    const inp = document.getElementById('searchInput');
                    inp.focus();
                    inp.select();
                }, 80);
            }
        }

        function toggleFilterDropdown(e) {
            e.stopPropagation();
            const p = document.getElementById('filterDropdown');
            const willOpen = !p.classList.contains('open');
            closeAllPanels();
            if (willOpen) p.classList.add('open');
        }

        document.addEventListener('click', (e) => {
            const wrappers = document.querySelectorAll('.dropdown-wrapper');
            let inside = false;
            wrappers.forEach(w => { if (w.contains(e.target)) inside = true; });
            if (!inside) closeAllPanels();
        });

        // ===== Folder rendering =====
        function renderFolderList() {
            const folders = getFolders();
            const list = document.getElementById('folderList');

            const allCount = getNotes().length;
            const unfiledCount = getUnfiledCount();

            let html = `
                <div class="folder-item ${currentFolder === 'all' ? 'selected' : ''}" onclick="selectFolder('all')">
                    <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M9 11H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1z"/><path d="M20 11h-5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1z"/><path d="M9 20H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1z"/><path d="M20 20h-5a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1z"/></svg>
                    <span class="fname">Tất cả ghi chú</span>
                    <span class="fcount">${allCount}</span>
                </div>
                <div class="folder-item ${currentFolder === 'none' ? 'selected' : ''}" onclick="selectFolder('none')">
                    <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                    <span class="fname">Không có thư mục</span>
                    <span class="fcount">${unfiledCount}</span>
                </div>
            `;

            if (folders.length > 0) {
                html += `<div class="folder-divider"></div>`;
                folders.forEach(f => {
                    const cnt = getFolderNoteCount(f.id);
                    html += `
                        <div class="folder-item ${currentFolder === f.id ? 'selected' : ''}" onclick="selectFolder('${f.id}')">
                            <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            <span class="fname">${escapeHtml(f.name)}</span>
                            <span class="fcount">${cnt}</span>
                            <span class="factions">
                                <button onclick="event.stopPropagation();promptRenameFolder('${f.id}')" title="Đổi tên">${ICONS.edit}</button>
                                <button onclick="event.stopPropagation();deleteFolder('${f.id}')" title="Xóa">${ICONS.trash}</button>
                            </span>
                        </div>
                    `;
                });
            }

            list.innerHTML = html;
        }

        function selectFolder(id) {
            currentFolder = id;
            currentPage = 1;
            document.getElementById('folderPanel').classList.remove('open');

            const btn = document.getElementById('folderBtn');
            const label = document.getElementById('folderBtnLabel');
            if (id === 'all') {
                btn.classList.remove('active');
                label.textContent = 'Thư mục';
            } else if (id === 'none') {
                btn.classList.add('active');
                label.textContent = 'Không thư mục';
            } else {
                btn.classList.add('active');
                const f = getFolderById(id);
                label.textContent = f ? f.name : 'Thư mục';
            }

            updateActiveBar();
            renderAll();
        }

        // ===== Prompt tạo/đổi tên =====
        function promptNewFolder() {
            closeAllPanels();
            promptMode = 'create';
            promptRenameId = null;
            document.getElementById('promptTitleText').textContent = 'Tạo thư mục mới';
            document.getElementById('promptConfirmBtn').textContent = 'Tạo';
            document.getElementById('promptInput').value = '';
            document.getElementById('promptModal').classList.add('open');
            setTimeout(() => document.getElementById('promptInput').focus(), 100);
        }

        function promptRenameFolder(id) {
            closeAllPanels();
            const f = getFolderById(id);
            if (!f) return;
            promptMode = 'rename';
            promptRenameId = id;
            document.getElementById('promptTitleText').textContent = 'Đổi tên thư mục';
            document.getElementById('promptConfirmBtn').textContent = 'Lưu';
            document.getElementById('promptInput').value = f.name;
            document.getElementById('promptModal').classList.add('open');
            setTimeout(() => {
                const inp = document.getElementById('promptInput');
                inp.focus();
                inp.select();
            }, 100);
        }

        function closePrompt() {
            document.getElementById('promptModal').classList.remove('open');
            promptRenameId = null;
        }

        function confirmPrompt() {
            const name = document.getElementById('promptInput').value.trim();
            if (!name) {
                alert('Vui lòng nhập tên thư mục!');
                return;
            }

            const folders = getFolders();

            if (promptMode === 'create') {
                // Kiểm tra trùng tên
                if (folders.some(f => f.name.toLowerCase() === name.toLowerCase())) {
                    alert('Tên thư mục đã tồn tại!');
                    return;
                }
                folders.push({
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                    name: name,
                    createdAt: new Date().toISOString()
                });
                saveFolders(folders);
            } else if (promptMode === 'rename') {
                if (folders.some(f => f.id !== promptRenameId && f.name.toLowerCase() === name.toLowerCase())) {
                    alert('Tên thư mục đã tồn tại!');
                    return;
                }
                const f = folders.find(f => f.id === promptRenameId);
                if (f) f.name = name;
                saveFolders(folders);
            }

            closePrompt();
            renderFolderList();
            refreshFolderSelects();
            updateFolderBtnLabel();
            updateActiveBar();
        }

        function deleteFolder(id) {
            const f = getFolderById(id);
            if (!f) return;

            const cnt = getFolderNoteCount(id);
            const msg = cnt > 0
                ? `Thư mục "${f.name}" có ${cnt} ghi chú. Xóa thư mục sẽ chuyển các ghi chú này ra "Không thư mục". Tiếp tục?`
                : `Bạn có chắc muốn xóa thư mục "${f.name}"?`;

            if (!confirm(msg)) return;

            // Chuyển notes ra khỏi folder
            const notes = getNotes();
            notes.forEach(n => { if (n.folderId === id) delete n.folderId; });
            saveNotes(notes);

            // Xóa folder
            const folders = getFolders().filter(f => f.id !== id);
            saveFolders(folders);

            if (currentFolder === id) {
                selectFolder('all');
            } else {
                renderFolderList();
                refreshFolderSelects();
                updateActiveBar();
                renderAll();
            }
        }

        function updateFolderBtnLabel() {
            const btn = document.getElementById('folderBtn');
            const label = document.getElementById('folderBtnLabel');
            if (currentFolder === 'all') {
                btn.classList.remove('active');
                label.textContent = 'Thư mục';
            } else if (currentFolder === 'none') {
                btn.classList.add('active');
                label.textContent = 'Không thư mục';
            } else {
                btn.classList.add('active');
                const f = getFolderById(currentFolder);
                label.textContent = f ? f.name : 'Thư mục';
            }
        }

        // ===== Folder selects trong editor + modal =====
        function refreshFolderSelects() {
            const folders = getFolders();

            // Editor select
            const editorSel = document.getElementById('editorFolderSelect');
            const editorVal = editorSel.value;
            editorSel.innerHTML = `<option value="">📁 Không thư mục</option>` +
                folders.map(f => `<option value="${f.id}">📁 ${escapeHtml(f.name)}</option>`).join('');
            if (editorVal) editorSel.value = editorVal;

            // Modal select
            const modalSel = document.getElementById('modalFolderSelect');
            const modalVal = modalSel.value;
            modalSel.innerHTML = `<option value="">— Không thư mục —</option>` +
                folders.map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');
            if (modalVal) modalSel.value = modalVal;
        }

        // ===== Search =====
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            currentSearch = '';
            currentPage = 1;
            updateSearchUI();
            updateActiveBar();
            renderAll();
            document.getElementById('searchInput').focus();
        }

        function handleSearchInput() {
            currentSearch = document.getElementById('searchInput').value;
            currentPage = 1;
            updateSearchUI();
            updateActiveBar();
            renderAll();
        }

        function updateSearchUI() {
            const clearBtn = document.getElementById('searchClear');
            const info = document.getElementById('searchInfo');

            if (currentSearch.trim()) {
                clearBtn.classList.add('show');
                const matched = getNotes().filter(n => {
                    if (!noteMatchesSearch(n, currentSearch.trim())) return false;
                    if (currentFolder === 'all') return true;
                    if (currentFolder === 'none') return !n.folderId;
                    return n.folderId === currentFolder;
                }).length;
                if (matched > 0) {
                    info.innerHTML = `Tìm thấy <span class="found">${matched}</span> ghi chú`;
                } else {
                    info.innerHTML = `<span class="not-found">Không tìm thấy ghi chú nào</span>`;
                }
            } else {
                clearBtn.classList.remove('show');
                info.innerHTML = `Nhập để tìm trong nội dung ghi chú`;
            }
        }

        // ===== Active bar =====
        function updateActiveBar() {
            const bar = document.getElementById('activeBar');
            const folderChip = document.getElementById('activeFolderChip');
            const filterChip = document.getElementById('activeFilterChip');
            const searchChip = document.getElementById('activeSearchChip');

            const hasFolder = currentFolder !== 'all';
            const hasFilter = currentFilter !== 'all';
            const hasSearch = currentSearch.trim() !== '';

            if (hasFolder) {
                folderChip.style.display = 'inline-flex';
                let label;
                if (currentFolder === 'none') label = 'Không thư mục';
                else {
                    const f = getFolderById(currentFolder);
                    label = f ? f.name : 'Thư mục';
                }
                document.getElementById('activeFolderChipLabel').textContent = label;
            } else folderChip.style.display = 'none';

            if (hasFilter) {
                filterChip.style.display = 'inline-flex';
                document.getElementById('activeFilterChipLabel').textContent = getFilterLabel(currentFilter);
            } else filterChip.style.display = 'none';

            if (hasSearch) {
                searchChip.style.display = 'inline-flex';
                const text = currentSearch.trim();
                document.getElementById('activeSearchChipLabel').textContent =
                    `"${text.length > 25 ? text.slice(0, 25) + '…' : text}"`;
            } else searchChip.style.display = 'none';

            if (hasFolder || hasFilter || hasSearch) bar.classList.add('show');
            else bar.classList.remove('show');
        }

        function clearAllFilters() {
            currentFilter = 'all';
            currentSearch = '';
            currentFolder = 'all';
            currentPage = 1;

            const filterBtn = document.getElementById('filterBtn');
            filterBtn.classList.remove('active');
            document.getElementById('filterBtnLabel').textContent = 'Lọc';

            document.querySelectorAll('.filter-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.filter === 'all');
            });

            document.getElementById('searchInput').value = '';
            updateSearchUI();
            updateFolderBtnLabel();
            updateActiveBar();
            renderAll();
        }

        function applyFilter(filter) {
            currentFilter = filter;
            currentPage = 1;
            document.getElementById('filterDropdown').classList.remove('open');

            const filterBtn = document.getElementById('filterBtn');
            const label = document.getElementById('filterBtnLabel');
            if (filter === 'all') {
                filterBtn.classList.remove('active');
                label.textContent = 'Lọc';
            } else {
                filterBtn.classList.add('active');
                label.textContent = getFilterLabel(filter);
            }

            document.querySelectorAll('.filter-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.filter === filter);
            });

            updateActiveBar();
            renderAll();
        }

        // ===== Format time =====
        function formatTime(isoString) {
            const d = new Date(isoString);
            const t = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            const s = d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            return `${t} - ${s}`;
        }

        function formatTimeShort(isoString) {
            const d = new Date(isoString);
            const now = new Date();
            const t = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            if (d.toDateString() === now.toDateString()) return t;
            if (d.getFullYear() === now.getFullYear()) return `${day}/${month} • ${t}`;
            return `${day}/${month}/${String(d.getFullYear()).slice(-2)} • ${t}`;
        }

        // ===== Month group =====
        function getMonthKey(isoString) {
            const d = new Date(isoString);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        }

        function getMonthLabel(monthKey) {
            const [y, m] = monthKey.split('-');
            return `Tháng ${parseInt(m, 10)}/${y}`;
        }

        function getFilteredSortedNotes() {
            let notes = getNotes();
            notes = filterNotesByFolder(notes);
            notes = filterNotesByTime(notes);

            const kw = currentSearch.trim();
            if (kw) notes = notes.filter(n => noteMatchesSearch(n, kw));

            return notes.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }

        function groupNotesByMonth(notes) {
            const groups = {};
            const order = [];
            notes.forEach(n => {
                const k = getMonthKey(n.createdAt);
                if (!groups[k]) { groups[k] = []; order.push(k); }
                groups[k].push(n);
            });
            order.sort((a, b) => b.localeCompare(a));
            return order.map(k => ({ monthKey: k, label: getMonthLabel(k), notes: groups[k] }));
        }

        function getTotalPages() {
            const total = getFilteredSortedNotes().length;
            return Math.max(1, Math.ceil(total / getNotesPerPage()));
        }

        // ===== Highlight =====
        function escapeRegex(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function highlightKeyword(text, keyword) {
            const safe = escapeHtml(text);
            if (!keyword) return safe;
            const k = keyword.trim();
            if (!k) return safe;
            try {
                const re = new RegExp(`(${escapeRegex(k)})`, 'gi');
                return safe.replace(re, '<mark>$1</mark>');
            } catch (e) { return safe; }
        }

        // ===== Render =====
        function renderAll() {
            renderNotes();
            renderPagination();
        }

        function renderNotes() {
            const notes = getFilteredSortedNotes();
            const allNotesCount = getNotes().length;
            const notesList = document.getElementById('notesList');
            const noteCount = document.getElementById('noteCount');
            const pagination = document.getElementById('pagination');

            const hasAny = currentFolder !== 'all' || currentFilter !== 'all' || currentSearch.trim() !== '';
            if (!hasAny) noteCount.textContent = `${allNotesCount} ghi chú`;
            else noteCount.textContent = `${notes.length}/${allNotesCount} ghi chú`;

            if (notes.length === 0) {
                let msg, icon, btn;
                if (currentSearch.trim()) {
                    msg = `Không tìm thấy ghi chú nào chứa "${currentSearch.trim()}"`;
                    icon = ICONS.search;
                    btn = `<button class="btn-add-empty" onclick="clearSearch()">Xóa từ khóa</button>`;
                } else if (currentFolder !== 'all') {
                    msg = 'Thư mục này chưa có ghi chú nào.';
                    icon = ICONS.folder;
                    btn = `<button class="btn-add-empty" onclick="openEditor()">${ICONS.plus} Thêm ghi chú</button>`;
                } else if (currentFilter !== 'all') {
                    msg = 'Không có ghi chú nào trong khoảng thời gian này.';
                    icon = ICONS.search;
                    btn = `<button class="btn-add-empty" onclick="clearAllFilters()">Xóa bộ lọc</button>`;
                } else {
                    msg = 'Chưa có ghi chú nào. Hãy viết ghi chú đầu tiên!';
                    icon = ICONS.file;
                    btn = `<button class="btn-add-empty" onclick="openEditor()">${ICONS.plus} Thêm ghi chú đầu tiên</button>`;
                }
                notesList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon-wrap">${icon}</div>
                        <p>${msg}</p>
                        ${btn}
                    </div>
                `;
                pagination.innerHTML = '';
                return;
            }

            const totalPages = getTotalPages();
            if (currentPage > totalPages) currentPage = totalPages;

            const perPage = getNotesPerPage();
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageNotes = notes.slice(start, end);

            const groups = groupNotesByMonth(pageNotes);
            const keyword = currentSearch.trim();

            notesList.innerHTML = groups.map(group => {
                const gridHtml = group.notes.map(note => {
                    const rawContent = note.content.trim() || '(Ghi chú trống)';
                    const isEmpty = !note.content.trim();
                    const timeShort = formatTimeShort(note.createdAt);

                    const previewHtml = isEmpty
                        ? escapeHtml(rawContent)
                        : (keyword ? highlightKeyword(rawContent, keyword) : escapeHtml(rawContent));

                    const matchedClass = (keyword && noteMatchesSearch(note, keyword)) ? ' matched' : '';

                    // Badge thư mục
                    let folderBadge = '';
                    if (note.folderId) {
                        const f = getFolderById(note.folderId);
                        if (f) {
                            folderBadge = `<span class="note-folder-badge" title="${escapeHtml(f.name)}">
                                <svg class="ic ic-xs" viewBox="0 0 24 24" style="width:9px;height:9px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                                ${escapeHtml(f.name)}
                            </span>`;
                        }
                    }

                    return `
                        <div class="note-card${matchedClass}" onclick="openModal('${note.id}')">
                            <span class="hole-ring"></span>
                            <span class="note-time">
                                <svg class="ic ic-xs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                                ${timeShort}
                            </span>
                            <div class="note-preview ${isEmpty ? 'empty' : ''}">${previewHtml}</div>
                            ${folderBadge}
                            <span class="note-expand-hint">
                                <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="month-group">
                        <div class="month-header">
                            <span class="month-badge">
                                <svg class="ic ic-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
                                ${group.label}
                            </span>
                            <span class="month-count">${group.notes.length} ghi chú</span>
                            <span class="month-line"></span>
                        </div>
                        <div class="notes-grid">${gridHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalNotes = getFilteredSortedNotes().length;
            if (totalNotes === 0) { pagination.innerHTML = ''; return; }
            const totalPages = getTotalPages();
            if (totalPages <= 1) {
                pagination.innerHTML = `<span class="page-info">Trang 1 / 1</span>`;
                return;
            }

            let html = '';
            html += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">${ICONS.chevronL}</button>`;
            const pages = getPageNumbers(currentPage, totalPages);
            pages.forEach(p => {
                if (p === '...') html += `<span class="page-info">…</span>`;
                else html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
            });
            html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">${ICONS.chevronR}</button>`;
            html += `<span class="page-info">Trang ${currentPage} / ${totalPages}</span>`;
            pagination.innerHTML = html;
        }

        function getPageNumbers(current, total) {
            const delta = 2;
            const range = [];
            const rangeWithDots = [];
            let l;
            for (let i = 1; i <= total; i++) {
                if (i === 1 || i === total || (i >= current - delta && i <= current + delta)) range.push(i);
            }
            for (let i of range) {
                if (l) {
                    if (i - l === 2) rangeWithDots.push(l + 1);
                    else if (i - l !== 1) rangeWithDots.push('...');
                }
                rangeWithDots.push(i);
                l = i;
            }
            return rangeWithDots;
        }

        function goToPage(page) {
            const totalPages = getTotalPages();
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderAll();
            document.getElementById('notesList').scrollTop = 0;
        }

        // ===== Modal =====
        function openModal(id) {
            const notes = getNotes();
            const note = notes.find(n => n.id === id);
            if (!note) return;

            currentNoteId = id;
            document.getElementById('modalTime').textContent = formatTime(note.createdAt);

            // Folder tag
            const tag = document.getElementById('modalFolderTag');
            const tagText = document.getElementById('modalFolderTagText');
            if (note.folderId) {
                const f = getFolderById(note.folderId);
                if (f) {
                    tag.style.display = 'inline-flex';
                    tagText.textContent = f.name;
                } else tag.style.display = 'none';
            } else tag.style.display = 'none';

            document.getElementById('modalContent').textContent = note.content;
            document.getElementById('modalFolderRow').classList.remove('show');
            refreshFolderSelects();
            document.getElementById('modalFolderSelect').value = note.folderId || '';

            exitEditMode();
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            currentNoteId = null;
            document.getElementById('modalFolderRow').classList.remove('show');
            exitEditMode();
        }

        function enterEditMode() {
            const notes = getNotes();
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;

            const contentEl = document.getElementById('modalContent');
            const editArea = document.getElementById('modalEditArea');

            editArea.value = note.content;
            contentEl.classList.add('edit-mode');
            editArea.classList.add('show');
            editArea.focus();

            document.getElementById('modalEditBtn').style.display = 'none';
            document.getElementById('modalDeleteBtn').style.display = 'none';
            document.getElementById('modalFolderMoveBtn').style.display = 'none';
            document.getElementById('modalSaveBtn').classList.add('show');
            document.getElementById('modalCancelBtn').classList.add('show');
            document.getElementById('modalFolderRow').classList.remove('show');
        }

        function exitEditMode() {
            const contentEl = document.getElementById('modalContent');
            const editArea = document.getElementById('modalEditArea');

            contentEl.classList.remove('edit-mode');
            editArea.classList.remove('show');
            editArea.value = '';

            document.getElementById('modalEditBtn').style.display = '';
            document.getElementById('modalDeleteBtn').style.display = '';
            document.getElementById('modalFolderMoveBtn').style.display = '';
            document.getElementById('modalSaveBtn').classList.remove('show');
            document.getElementById('modalCancelBtn').classList.remove('show');
            document.getElementById('modalFolderRow').classList.remove('show');
        }

        function toggleFolderMove() {
            const row = document.getElementById('modalFolderRow');
            const notes = getNotes();
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;

            if (row.classList.contains('show')) {
                row.classList.remove('show');
            } else {
                refreshFolderSelects();
                document.getElementById('modalFolderSelect').value = note.folderId || '';
                row.classList.add('show');
            }
        }

        function saveModalEdit() {
            const editArea = document.getElementById('modalEditArea');
            const newContent = editArea.value.trim();
            if (!newContent) { alert('Nội dung không được để trống!'); return; }

            const notes = getNotes();
            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                note.content = newContent;
                note.updatedAt = new Date().toISOString();
                // Nếu đang mở folder row thì áp dụng luôn
                const row = document.getElementById('modalFolderRow');
                if (row.classList.contains('show')) {
                    const selVal = document.getElementById('modalFolderSelect').value;
                    if (selVal) note.folderId = selVal;
                    else delete note.folderId;
                }
                saveNotes(notes);
            }

            document.getElementById('modalContent').textContent = newContent;
            exitEditMode();
            updateSearchUI();
            updateFolderBtnLabel();
            renderAll();
        }

        function moveNoteToFolder() {
            const selVal = document.getElementById('modalFolderSelect').value;
            const notes = getNotes();
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;

            if (selVal) note.folderId = selVal;
            else delete note.folderId;
            saveNotes(notes);

            // Cập nhật tag
            const tag = document.getElementById('modalFolderTag');
            const tagText = document.getElementById('modalFolderTagText');
            if (note.folderId) {
                const f = getFolderById(note.folderId);
                if (f) { tag.style.display = 'inline-flex'; tagText.textContent = f.name; }
            } else tag.style.display = 'none';

            document.getElementById('modalFolderRow').classList.remove('show');
            updateFolderBtnLabel();
            renderAll();
        }

        function deleteModalNote() {
            if (!confirm('Bạn có chắc muốn xóa ghi chú này?')) return;
            const notes = getNotes().filter(n => n.id !== currentNoteId);
            saveNotes(notes);
            const totalPages = getTotalPages();
            if (currentPage > totalPages) currentPage = totalPages;
            closeModal();
            updateSearchUI();
            renderFolderList();
            renderAll();
        }

        // ===== Editor =====
        function openEditor() {
            const editor = document.getElementById('editorSection');
            editor.classList.add('open');
            refreshFolderSelects();
            // Nếu đang ở folder cụ thể, chọn luôn folder đó
            if (currentFolder !== 'all' && currentFolder !== 'none') {
                document.getElementById('editorFolderSelect').value = currentFolder;
            } else {
                document.getElementById('editorFolderSelect').value = '';
            }
            setTimeout(() => document.getElementById('noteInput').focus(), 200);
        }

        function closeEditor() {
            const editor = document.getElementById('editorSection');
            editor.classList.remove('open');
            const input = document.getElementById('noteInput');
            input.value = '';
            document.getElementById('editorFolderSelect').value = '';
            updateCharCount();
        }

        function addNote() {
            const input = document.getElementById('noteInput');
            const content = input.value.trim();
            if (!content) { input.focus(); return; }

            const folderVal = document.getElementById('editorFolderSelect').value;
            const notes = getNotes();
            const newNote = {
                id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                content: content,
                createdAt: new Date().toISOString()
            };
            if (folderVal) newNote.folderId = folderVal;

            notes.push(newNote);
            saveNotes(notes);

            closeEditor();
            currentPage = 1;
            updateSearchUI();
            renderFolderList();
            updateFolderBtnLabel();
            renderAll();
        }

        function updateCharCount() {
            const input = document.getElementById('noteInput');
            document.getElementById('charCount').textContent = `${input.value.length} ký tự`;
        }

        // ===== Init =====
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('noteInput');
            const toggleBtn = document.getElementById('toggleEditorBtn');
            const saveBtn = document.getElementById('saveBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const editor = document.getElementById('editorSection');
            const overlay = document.getElementById('modalOverlay');
            const searchInput = document.getElementById('searchInput');

            toggleBtn.addEventListener('click', () => {
                if (editor.classList.contains('open')) closeEditor();
                else openEditor();
            });

            saveBtn.addEventListener('click', addNote);
            cancelBtn.addEventListener('click', closeEditor);
            input.addEventListener('input', updateCharCount);
            input.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') addNote();
                else if (e.key === 'Escape') closeEditor();
            });

            searchInput.addEventListener('input', handleSearchInput);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') document.getElementById('searchPanel').classList.remove('open');
            });

            overlay.addEventListener('click', closeModal);
            document.getElementById('modalEditBtn').addEventListener('click', enterEditMode);
            document.getElementById('modalDeleteBtn').addEventListener('click', deleteModalNote);
            document.getElementById('modalSaveBtn').addEventListener('click', saveModalEdit);
            document.getElementById('modalCancelBtn').addEventListener('click', exitEditMode);
            document.getElementById('modalFolderMoveBtn').addEventListener('click', toggleFolderMove);
            document.getElementById('modalFolderSelect').addEventListener('change', moveNoteToFolder);

            document.getElementById('modalEditArea').addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') saveModalEdit();
                else if (e.key === 'Escape') exitEditMode();
            });

            // Prompt events
            document.getElementById('promptConfirmBtn').addEventListener('click', confirmPrompt);
            document.getElementById('promptInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') confirmPrompt();
                else if (e.key === 'Escape') closePrompt();
            });
            document.getElementById('promptModal').addEventListener('click', closePrompt);

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    closeAllPanels();
                    const panel = document.getElementById('searchPanel');
                    panel.classList.add('open');
                    setTimeout(() => {
                        searchInput.focus();
                        searchInput.select();
                    }, 80);
                    return;
                }
                if (e.key === 'Escape' && overlay.classList.contains('open')) {
                    const editArea = document.getElementById('modalEditArea');
                    if (editArea.classList.contains('show')) exitEditMode();
                    else closeModal();
                }
            });

            let lastIsMobile = window.matchMedia('(max-width: 768px)').matches;
            window.addEventListener('resize', () => {
                const isMobile = window.matchMedia('(max-width: 768px)').matches;
                if (isMobile !== lastIsMobile) {
                    lastIsMobile = isMobile;
                    currentPage = 1;
                    renderAll();
                }
            });

            document.querySelector('.filter-option[data-filter="all"]').classList.add('selected');

            refreshFolderSelects();
            renderFolderList();
            updateSearchUI();
            updateActiveBar();
            renderAll();
        });
    </script>
</body>
</html>
